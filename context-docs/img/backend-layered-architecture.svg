<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#0f172a"/>
  <text x="600" y="52" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="34" font-weight="700">Superset Layered Architecture</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="430" y="90" width="340" height="70" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="600" y="133" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22">REST / UI Requests</text>

  <rect x="400" y="200" width="400" height="80" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="600" y="235" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="22">Web Layer</text>
  <text x="600" y="262" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Flask + FAB Views/APIs</text>

  <rect x="90" y="330" width="260" height="90" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="220" y="370" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20">Security Layer</text>
  <text x="220" y="398" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">AuthN + RBAC + RLS</text>

  <rect x="380" y="330" width="440" height="90" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="600" y="370" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20">Application Layer</text>
  <text x="600" y="398" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Superset services/commands</text>

  <rect x="850" y="330" width="260" height="90" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="980" y="370" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20">Metadata ORM</text>
  <text x="980" y="398" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Platform state</text>

  <rect x="230" y="490" width="280" height="90" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="370" y="530" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20">Query Layer</text>
  <text x="370" y="558" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Engine specs + SQLAlchemy</text>

  <rect x="540" y="490" width="220" height="90" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="650" y="530" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20">Cache / Results</text>
  <text x="650" y="558" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Performance layer</text>

  <rect x="790" y="490" width="220" height="90" rx="10" fill="#1e293b" stroke="#64748b"/>
  <text x="900" y="530" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="20">Async Tasks</text>
  <text x="900" y="558" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Celery workers</text>

  <ellipse cx="320" cy="680" rx="140" ry="34" fill="#14532d" stroke="#4ade80"/>
  <text x="320" y="687" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="20">External Databases</text>

  <ellipse cx="930" cy="680" rx="140" ry="34" fill="#14532d" stroke="#4ade80"/>
  <text x="930" y="687" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="20">Metadata DB</text>

  <line x1="600" y1="160" x2="600" y2="198" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="280" x2="220" y2="328" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="280" x2="600" y2="328" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="280" x2="980" y2="328" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="600" y1="420" x2="370" y2="488" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="420" x2="650" y2="488" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="420" x2="900" y2="488" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="980" y1="420" x2="930" y2="644" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="370" y1="580" x2="320" y2="644" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="580" x2="320" y2="644" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
