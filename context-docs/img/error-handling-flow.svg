<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#111827"/>
  <text x="600" y="52" text-anchor="middle" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="34" font-weight="700">Superset Error Handling Flow</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="500" y="90" width="200" height="64" rx="10" fill="#1f2937" stroke="#6b7280"/>
  <text x="600" y="130" text-anchor="middle" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="21">Request</text>

  <rect x="430" y="200" width="340" height="80" rx="10" fill="#1f2937" stroke="#6b7280"/>
  <text x="600" y="235" text-anchor="middle" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="22">Web/API Layer</text>
  <text x="600" y="262" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Route handling + response shaping</text>

  <rect x="420" y="330" width="360" height="80" rx="10" fill="#1f2937" stroke="#6b7280"/>
  <text x="600" y="365" text-anchor="middle" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="22">Service/Command Layer</text>
  <text x="600" y="392" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Domain orchestration + exception mapping</text>

  <rect x="160" y="490" width="320" height="90" rx="10" fill="#1f2937" stroke="#6b7280"/>
  <text x="320" y="530" text-anchor="middle" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="20">Engine/Driver Layer</text>
  <text x="320" y="558" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">SQLAlchemy + DB driver exceptions</text>

  <rect x="720" y="490" width="320" height="90" rx="10" fill="#1f2937" stroke="#6b7280"/>
  <text x="880" y="530" text-anchor="middle" fill="#e5e7eb" font-family="Arial, sans-serif" font-size="20">Metadata ORM Layer</text>
  <text x="880" y="558" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="16">Metadata persistence exceptions</text>

  <ellipse cx="240" cy="680" rx="130" ry="32" fill="#14532d" stroke="#4ade80"/>
  <text x="240" y="687" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="20">External DB</text>

  <ellipse cx="960" cy="680" rx="130" ry="32" fill="#14532d" stroke="#4ade80"/>
  <text x="960" y="687" text-anchor="middle" fill="#dcfce7" font-family="Arial, sans-serif" font-size="20">Metadata DB</text>

  <rect x="430" y="620" width="340" height="80" rx="10" fill="#7f1d1d" stroke="#f87171"/>
  <text x="600" y="655" text-anchor="middle" fill="#fee2e2" font-family="Arial, sans-serif" font-size="21">HTTP Response + Structured Log</text>
  <text x="600" y="682" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="15">Mapped status + safe message + correlation data</text>

  <line x1="600" y1="154" x2="600" y2="198" stroke="#9ca3af" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="600" y1="280" x2="600" y2="328" stroke="#9ca3af" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="560" y1="410" x2="380" y2="488" stroke="#9ca3af" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="640" y1="410" x2="820" y2="488" stroke="#9ca3af" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="290" y1="580" x2="250" y2="648" stroke="#9ca3af" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="910" y1="580" x2="950" y2="648" stroke="#9ca3af" stroke-width="3" marker-end="url(#arr)"/>

  <line x1="320" y1="490" x2="520" y2="410" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <line x1="880" y1="490" x2="680" y2="410" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <line x1="600" y1="410" x2="600" y2="618" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr)"/>
